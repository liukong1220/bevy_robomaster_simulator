[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.19", features = ["dynamic_linking", "jpeg"] }
avian3d = "0.7"
bevy-inspector-egui = "0.37"
memmap2 = { version = "0" }

[package]
name = "daedalus"
version = "0.1.0"
edition = "2024"
default-run = "daedalus"

[features]
ros2 = ["dep:r2r"]
talos = ["dep:talos-ipc"]
ffmpeg = ["dep:ffmpeg-next"]
default = ["talos"]

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true }
bevy-inspector-egui = { workspace = true }
rand = "0.10"
r2r = { version = "0", optional = true }
talos-ipc = { path = "crates/talos-ipc", optional = true }
crossbeam-channel = "0"
image = "0"
egui = "0"
futures = "0"
exact = { path = "crates/exact" }
toml = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
ffmpeg-next = { version = "8.1.0", optional = true }
# 不在代码里 use，唯一目的是打开 icu_provider 的 logging feature。
#
# parley/icu_segmenter 给中日韩文本断行时要找 "cjdict" 分词模型，bevy 编译进来的
# icu 数据里没有，于是每次文字整形都报一次 "No segmentation model for language: ja"。
# 关键在于这条消息**默认不走 tracing**：icu_provider 的 logging feature 关掉时，
# 它内部的 `log::warn!` 是 `pub use std::eprintln as warn`（见 icu_provider
# src/lib.rs 的 log shim，只受 debug_assertions 约束），直接 eprintln 到 stderr。
# 所以 LogPlugin 里 `icu_provider=error` 这类按 target 过滤的指令根本匹配不到它
# ——裸 eprintln 没有 target。打开 logging 后它改走 log facade，bevy 的
# LogTracer 会把 log 记录桥进 tracing（target = 模块路径 icu_provider::error），
# 那条过滤指令才真正生效。
#
# 用直接依赖来开 feature 是因为 feature 统一：icu_provider 是 bevy 的间接依赖，
# 没法从 bevy 那边指定。版本要与 Cargo.lock 中 bevy 拉进来的一致。
icu_provider = { version = "2.2", default-features = false, features = ["logging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false }
objc2-metal-fx = "0.3.2"
wgpu = "29.0.3"

[[bin]]
name = "talos_gimbal_mock_server"
path = "src/bin/talos_gimbal_mock_server.rs"
required-features = ["talos", "ffmpeg"]

[patch.crates-io]
r2r_msg_gen = { path = "third_party/r2r_msg_gen" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
